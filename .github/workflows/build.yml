name: Générer le site
on:
  push:
    branches: [main]
    paths: ["content/**", "src/**", "build.mjs", "site.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RACINE_TOKEN: ${{ secrets.RACINE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - name: Enregistrer les pages générées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Régénérer le site"
          git push
      - name: Publier l'accueil de l'adresse principale (dépôt mehdinourreddine62.github.io)
        if: env.RACINE_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${RACINE_TOKEN}@github.com/mehdinourreddine62/mehdinourreddine62.github.io.git" ../racine-depot
          cp -r racine/. ../racine-depot/
          cd ../racine-depot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Mettre à jour l'accueil depuis clic-par-clic"; git push; }
